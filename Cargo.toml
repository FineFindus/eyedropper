[package]
name = "eyedropper"
version = "2.2.1"
authors = ["FineFindus <finefindus@proton.me>"]
edition = "2024"
description = "Pick and format colors"
readme = "README.md"
license-file = "LICENSE"
homepage = "https://apps.gnome.org/Eyedropper/"
repository = "https://github.com/finefindus/eyedropper"
rust-version = "1.98"


# override package level optimization, to always be maximum
[profile.release.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
phf = { version = "0.14", default-features = false }
phf_codegen = "0.14"

[dependencies]
tracing-subscriber = "0.3"
tracing = "0.1"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
once_cell = "1.21"
gtk = { version = "0.11", package = "gtk4", features = ["v4_22", "gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
ashpd = { version = "0.14", default-features = false, features = [
    "async-io",
    "gtk4",
    "global_shortcuts",
    "screenshot",
    "background",
] }
futures = "0.3"
rand = "0.10"
search-provider = { git = "https://gitlab.gnome.org/FineFindus/search-provider.git", rev = "388b9668e734b45307bac66d522333d60ab2a305", features = [
    "gdk-pixbuf",
] }

nom = "8.0"
phf = "0.14"
palette = "0.7"
